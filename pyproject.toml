[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-copilot"
version = "0.1.0.dev1"
description = "Personal portfolio and market monitor — local demo prototype"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["streamlit==1.66.0", "plotly>=6,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
